services:
  # Serviciul PHP + Apache (site-ul tău)
  web:
    build: .
    container_name: site_web
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    restart: unless-stopped

  # Serviciul MySQL
  db:
    image: mysql:8.0
    container_name: site_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: site_db
      MYSQL_USER: user
      MYSQL_PASSWORD: userpass
    ports:
      - "3306:3306"
    volumes:
      - ./db_data:/var/lib/mysql

  # phpMyAdmin (interfață web pentru baza de date)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: site_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpass
    depends_on:
      - db
